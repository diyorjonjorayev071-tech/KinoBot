<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050805">
  <title>xD KINO</title>
  <link rel="stylesheet" href="/static/app.css?v=clean1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="poster-wall"></div>
    <div class="film-strip film-strip-a"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="film-strip film-strip-b"><span></span><span></span><span></span><span></span></div>

    <div class="reel reel-left">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="reel reel-right">
      <i></i><i></i><i></i><i></i><i></i>
    </div>

    <div class="clapper" aria-hidden="true"><b></b><em></em></div>
    <div class="popcorn" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>

    <div class="splash-core">
      <div class="xd-logo"><span class="play">▶</span><b>xD</b></div>
      <div class="splash-title"><b>xD</b> KINO</div>
      <div class="splash-sub">Sizning kino olamingiz</div>
      <div class="loader"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-screen="home" aria-label="Bosh sahifa"><span>xD</span> KINO</button>
      <div class="top-actions">
        <button id="searchShortcut" class="icon-btn" aria-label="Qidiruv">⌕</button>
        <div id="avatar" class="avatar">D</div>
      </div>
    </header>

    <main>
      <section id="homeScreen" class="screen active">
        <div id="hero" class="hero skeleton"></div>

        <section class="content-section recommendation-section">
          <div class="section-head"><h2>Siz uchun tavsiyalar</h2><span>IMDb 7.5+</span></div>
          <div id="storyStrip" class="story-strip"></div>
        </section>

        <section class="content-section genre-section">
          <div class="section-head"><h2>Janrlar</h2></div>
          <div id="genreStrip" class="genre-strip"></div>
        </section>

        <div id="homeSections"></div>
      </section>

      <section id="searchScreen" class="screen">
        <div class="page-title"><h1>Qidiruv</h1><p>Kino, serial va multfilmni tez toping</p></div>
        <div class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Kino nomini yozing..." autocomplete="off"></div>
        <div class="filters">
          <select id="typeFilter"><option value="">Barcha turlar</option></select>
          <select id="genreFilter"><option value="">Barcha janrlar</option></select>
          <select id="yearFilter"><option value="">Barcha yillar</option></select>
          <select id="countryFilter"><option value="">Barcha davlatlar</option></select>
        </div>
        <div id="searchStatus" class="muted-line"></div>
        <div id="searchGrid" class="movie-grid"></div>
      </section>

      <section id="savedScreen" class="screen">
        <div class="page-title"><h1>Saqlanganlar</h1><p>Sevimli kinolaringiz shu yerda</p></div>
        <div id="savedGrid" class="movie-grid"></div>
      </section>

      <section id="profileScreen" class="screen">
        <div class="profile-card">
          <div id="profileAvatar" class="profile-avatar">D</div>
          <div><h1 id="profileName">xD KINO foydalanuvchisi</h1><p id="profileUser">Telegram Mini App</p></div>
        </div>
        <div class="stats">
          <div><b id="favCount">0</b><span>Saqlangan</span></div>
          <div><b id="historyCount">0</b><span>Ko‘rilgan</span></div>
          <div><b>24/7</b><span>Kino olami</span></div>
        </div>
        <section class="content-section">
          <div class="section-head"><h2>Oxirgi ko‘rilganlar</h2><button id="clearHistory" class="text-btn">Tozalash</button></div>
          <div id="historyRow" class="movie-row"></div>
        </section>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="home"><span>⌂</span><small>Bosh sahifa</small></button>
      <button class="nav-btn" data-screen="search"><span>⌕</span><small>Qidiruv</small></button>
      <button class="nav-btn" data-screen="saved"><span>♡</span><small>Saqlangan</small></button>
      <button class="nav-btn" data-screen="profile"><span>◉</span><small>Profil</small></button>
    </nav>
  </div>

  <div id="detailOverlay" class="detail-overlay" aria-hidden="true">
    <div class="detail-sheet">
      <button id="detailClose" class="detail-close" aria-label="Yopish">×</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/app.js?v=clean1"></script>
</body>
</html>
